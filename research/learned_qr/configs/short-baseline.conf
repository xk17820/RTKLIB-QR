# Forward short-baseline training/deployment profile. No true coordinates enter the filter.
pos1-posmode       =kinematic
pos1-frequency     =l1+l2
pos1-soltype       =forward
pos1-elmask        =15
pos1-dynamics      =on
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =41
pos2-armode        =continuous
pos2-gloarmode     =off
pos2-niter         =1
pos2-maxage        =0.05
misc-timeinterp    =off
ant2-postype       =rinexhead
out-solformat      =xyz
out-timesys        =gpst
out-timeform       =tow
out-outhead        =on
