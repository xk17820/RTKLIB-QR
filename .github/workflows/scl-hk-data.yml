name: SCL Hong Kong GNSS data acquisition
on:
  push:
    branches: [research/learned-qr]
    paths: ['.github/workflows/scl-hk-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    if: github.repository == 'xk17820/RTKLIB-QR' && github.ref == 'refs/heads/research/learned-qr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dataset: [medium, deep, harsh, tunnel]
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - name: Acquire original public GNSS and reference, no performance claims
        shell: bash
        run: |
          mkdir -p acquisition/files
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys, time, urllib.request, zipfile
          datasets = {
            'medium': ('UrbanNav-HK-Medium-Urban-1','https://www.dropbox.com/sh/2haoy68xekg95zl/AAAkcN4FwhFxkPY1lXsxbJrxa?dl=1','https://www.dropbox.com/s/twsvwftucoytfpc/UrbanNav_TST_GT_raw.txt?dl=1'),
            'deep': ('UrbanNav-HK-Deep-Urban-1','https://www.dropbox.com/sh/7ox7718bzcjqtlf/AABH_Kjm65gHQ09K3antBRdua?dl=1','https://www.dropbox.com/s/ej2mkue2w3r36s2/UrbanNav_whampoa_raw.txt?dl=1'),
            'harsh': ('UrbanNav-HK-Harsh-Urban-1','https://www.dropbox.com/sh/xej1cxv3a0erffc/AADfhRODJk__Z49WC1R0Nw5ea?dl=1','https://www.dropbox.com/s/zqmxgf59bp7en6c/UrbanNav_mongkok_GT_part_raw.txt?dl=1'),
            'tunnel': ('UrbanNav-HK-Tunnel-1','https://www.dropbox.com/sh/9new5uwl7f9d2c9/AAAdisSwBOOi40Vf3r5PGtSCa?dl=1','https://www.dropbox.com/s/fqsviiei3r5tu6r/UrbanNav_tunnel_GT_raw.txt?dl=1'),
          }
          name = os.environ['DATASET']; title, gnss, gt = datasets[name]
          root = pathlib.Path('acquisition'); report = {'dataset':title,'source':'https://github.com/IPNL-POLYU/UrbanNavDataset','started_unix_s':time.time(),'download_success':False,'files':[],'downloads':[]}
          def download(url, target, ceiling):
              record={'url':url};report['downloads'].append(record)
              h=hashlib.sha256();n=0
              req=urllib.request.Request(url,headers={'User-Agent':'RTKLIB-QR-public-research-data/1.0'})
              with urllib.request.urlopen(req,timeout=180) as src, target.open('wb') as dst:
                  record['status']=src.status;record['content_type']=src.headers.get('Content-Type')
                  while True:
                      b=src.read(1024*1024)
                      if not b:break
                      n+=len(b)
                      if n>ceiling:raise ValueError('download ceiling exceeded')
                      h.update(b);dst.write(b)
              record.update(bytes=n,sha256=h.hexdigest())
          try:
              archive=pathlib.Path('/tmp/gnss.zip');download(gnss,archive,2*1024**3)
              if not zipfile.is_zipfile(archive):raise ValueError('GNSS source did not return ZIP')
              total=0
              with zipfile.ZipFile(archive) as z:
                  report['archive_members']=len(z.infolist())
                  for entry in z.infolist():
                      if entry.is_dir():continue
                      p=pathlib.PurePosixPath(entry.filename)
                      if p.is_absolute() or '..' in p.parts or '\\' in entry.filename or ((entry.external_attr>>16)&0o170000)==0o120000:raise ValueError('unsafe ZIP member')
                      if p.name.lower().endswith(('.bag','.mp4','.mkv','.jpg','.png','.pcd')):continue
                      total+=entry.file_size
                      if total>2*1024**3:raise ValueError('extraction ceiling exceeded')
                      target=root/'files'/pathlib.Path(*p.parts);target.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(entry) as src,target.open('xb') as dst:
                          while True:
                              b=src.read(1024*1024)
                              if not b:break
                              dst.write(b)
              download(gt,root/'files'/'reference_raw.txt',50*1024**2)
              calibration='https://raw.githubusercontent.com/IPNL-POLYU/UrbanNavDataset/master/'+title+'/extrinsic.yaml'
              download(calibration,root/'files'/'extrinsic.yaml',1024**2)
              for p in sorted((root/'files').rglob('*')):
                  if p.is_file():report['files'].append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              report['download_success']=True
          except Exception as e:report.update(error_type=type(e).__name__,error=str(e))
          finally:
              report['finished_unix_s']=time.time()
              (root/'ACQUISITION.json').write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps(report,indent=2))
          if not report['download_success']:sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scl-public-data-hk-${{ matrix.dataset }}
          path: acquisition/
          retention-days: 14
          compression-level: 6
