name: Learned QR validation
on:
  push:
    branches: [research/learned-qr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'xk17820/RTKLIB-QR' && github.ref == 'refs/heads/research/learned-qr'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native and Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Apply checksum-verified SCL source
        if: hashFiles('.scl-publication/install.py') != ''
        run: python .scl-publication/install.py apply
      - name: Build native solver and bridge with assertions enabled
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE='-O2 -UNDEBUG'
          cmake --build build -j2
      - name: Upstream native tests
        run: ctest --test-dir build --output-on-failure | tee /tmp/scl-ctest.txt
      - name: Learned covariance and native gradient regression tests
        working-directory: research/learned_qr
        run: python -m pytest -q | tee /tmp/scl-pytest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scl-validation
          path: /tmp/scl-*.txt
          retention-days: 14
      - name: Publish verified source only to approved research branch
        if: hashFiles('.scl-publication/install.py') != ''
        env:
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .scl-publication/install.py publish
      - name: Archive source
        run: git archive --format=tar.gz -o /tmp/scl-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: scl-source
          path: /tmp/scl-source.tar.gz
          retention-days: 14
