name: Learned QR validation
on:
  push:
    branches: [research/learned-qr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'xk17820/RTKLIB-QR' && github.ref == 'refs/heads/research/learned-qr'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native and Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Apply checksum-verified repair source
        if: hashFiles('.qr-repair/install.py') != ''
        run: python .qr-repair/install.py apply
      - name: Build all native targets with test assertions enabled
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE='-O3 -UNDEBUG' \
            -DCMAKE_CXX_FLAGS_RELEASE='-O3 -UNDEBUG'
          cmake --build build -j2
      - name: Upstream native test suite
        run: ctest --test-dir build --output-on-failure --output-log /tmp/qr-ctest.txt
      - name: Q R training and native replay tests
        working-directory: research/learned_qr
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/qr-pytest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-validation
          path: |
            /tmp/qr-ctest.txt
            /tmp/qr-pytest.txt
          retention-days: 14
      - name: Publish verified source on approved research branch
        if: hashFiles('.qr-repair/install.py') != ''
        env:
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .qr-repair/install.py publish
      - name: Archive verified source
        run: git archive --format=tar.gz -o /tmp/qr-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: qr-source
          path: /tmp/qr-source.tar.gz
          retention-days: 14
