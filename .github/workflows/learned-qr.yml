name: Learned QR validation
on:
  push:
    branches: [research/learned-qr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'xk17820/RTKLIB-QR' && github.ref == 'refs/heads/research/learned-qr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Apply checksum-pinned tested source
        if: hashFiles('.qr-publication/install.py') != ''
        run: python .qr-publication/install.py apply
      - name: Build all native targets including learned QR bridge
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Upstream native test suite
        run: ctest --test-dir build --output-on-failure
      - name: Q R training and native replay tests
        working-directory: research/learned_qr
        run: python -m pytest -q
      - name: Publish verified exact source to approved research branch
        if: hashFiles('.qr-publication/install.py') != ''
        run: python .qr-publication/install.py publish
      - name: Archive verified source
        run: git archive --format=tar.gz -o /tmp/qr-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: qr-source
          path: /tmp/qr-source.tar.gz
          retention-days: 7
