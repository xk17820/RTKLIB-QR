name: Learned QR validation
on:
  push:
    branches: [research/learned-qr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package source for reproducible review
        run: git archive --format=tar.gz -o /tmp/qr-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: qr-source
          path: /tmp/qr-source.tar.gz
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Component tests
        working-directory: research/learned_qr
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q
      - name: Build native console solver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target rnx2rtkp -j2
